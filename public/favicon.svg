<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Cross at top -->
    <path d="M64 16 L64 26 M58 20 L70 20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Finial circle -->
    <circle cx="64" cy="29" r="3.5"/>
    
    <!-- Left spire side -->
    <polygon points="64,32 36,110 50,110 64,48" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right spire side -->
    <polygon points="64,32 92,110 78,110 64,48" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Center line -->
    <line x1="64" y1="32" x2="64" y2="110" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Base details -->
    <line x1="50" y1="110" x2="50" y2="118" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="64" y1="110" x2="64" y2="120" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="110" x2="78" y2="118" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Gothic arches at base -->
    <path d="M 54 115 Q 50 110 46 115" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 68 115 Q 64 110 60 115" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 82 115 Q 78 110 74 115" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <style>
        svg { fill: none; }
        path, line, polygon, circle { stroke: #1a1a1a; fill: none; }
        circle { fill: #1a1a1a; }
        @media (prefers-color-scheme: dark) {
            path, line, polygon, circle { stroke: #ffffff; }
            circle { fill: #ffffff; }
        }
    </style>
</svg>
